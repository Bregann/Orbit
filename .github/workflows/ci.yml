# Runs on every pull request (including Renovate's) and on pushes to main.
# Renovate only auto-merges an update once every job here passes.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: .NET API (format, build, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Orbit.sln
      - name: Check formatting
        run: dotnet format Orbit.sln --verify-no-changes --no-restore
      - run: dotnet build Orbit.sln --no-restore -c Release
      - name: Run tests (Testcontainers uses the runner's Docker)
        run: dotnet test Orbit.sln --no-build -c Release

  web:
    name: Next.js site (lint, type-check, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orbit.web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: orbit.web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  app:
    name: Expo app (type-check, SDK versions)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orbit.app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: orbit.app/package-lock.json
      - run: npm ci
      - name: Type-check
        # TODO: orbit.app has existing type errors (tab bar colours, authContext, IngredientPickerModal).
        # Fix them, then delete continue-on-error so this step blocks merges.
        continue-on-error: true
        run: npx tsc --noEmit
      - name: Check packages match the Expo SDK
        # Advisory only: flags when the app is behind its Expo SDK's expected versions.
        # Renovate leaves Expo packages alone, so fix with `npx expo install --fix` and test on a device.
        continue-on-error: true
        run: npx expo install --check
